name: Android APK

on:
  push:
    paths:
      - "lalefon/**"
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Put the phone into the app
        run: |
          mkdir -p android/app/src/main/assets
          {
            echo '<!doctype html><html lang="sr"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            echo '</head><body>'
            cat lalefon/index.html
            echo '</body></html>'
          } > android/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lalefon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lalefon-apk
          path: Lalefon.apk

      - name: Publish as the "lalefon-apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lalefon-apk --yes --cleanup-tag || true
          gh release create lalefon-apk Lalefon.apk \
            --target "$GITHUB_SHA" \
            --title "Lalefon (Android APK)" \
            --notes "Automatski napravljeno iz grane ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Preuzmi Lalefon.apk na telefonu i instaliraj ga."
